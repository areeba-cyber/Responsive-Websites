        <label for="name">Name:</label>

        <input type="text" id="flight-number" name="flight-number" placeholder="Your Flight Number" required>

        <input type="date" id="date" name="date" required>

        <label for="rating">Rating:</label>
        <input type="number" id="rating" name="rating" min="1" max="5" placeholder="Your Rating (1-5)" required>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Your Comments" required></textarea>
