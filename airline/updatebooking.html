    <section class="submit">
    <div class="container">
        <h2>Update Booking</h2>
        <form action="updatebooking.php" method="POST">
            <label for="departure">Departure City (to identify booking):</label>
            <input type="text" id="departure" name="departure" placeholder="Enter Departure City" required />

            <label for="arrival">Arrival City:</label>
            <input type="text" id="arrival" name="arrival" placeholder="Enter Arrival City" required />

            <label for="departure_date">Departure Date:</label>
            <input type="date" id="departure_date" name="departure_date" required />

            <label for="return_date">Return Date:</label>
            <input type="date" id="return_date" name="return_date" required />

            <label for="passengers">Number of Passengers:</label>
            <input type="number" id="passengers" name="passengers" min="1" required />

            <label for="class">Class:</label>
            <select id="class" name="class" required>
                <option value="Economy">Economy</option>
                <option value="Business">Business</option>
                <option value="First">First</option>
            </select>

            <label for="special_requests">Special Requests:</label>
            <textarea id="special_requests" name="special_requests" placeholder="Any special requests"></textarea>

            <button type="submit">Update Booking</button>
        </form>
    </div>
