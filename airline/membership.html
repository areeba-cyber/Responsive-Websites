        <h2>Membership / Loyalty Program</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Your Address" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label for="membership-tier">Membership Tier:</label>
        <select id="membership-tier" name="membership-tier" required>
          <option value="silver">Silver</option>
          <option value="gold">Gold</option>
          <option value="platinum">Platinum</option>
        </select>

        <label for="preferences">Preferences:</label>
        <textarea id="preferences" name="preferences" rows="4" placeholder="Your Preferences" required></textarea>

        <button type="submit">Join Program</button>
      </form>
